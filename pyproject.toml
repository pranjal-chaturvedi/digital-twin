[project]
name = "digital-twin"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.34.0",
    "pydantic>=2.13.3",
    "pypdf>=6.10.2",
    "python-dotenv>=1.2.2",
    "gradio>=6.31.0",
    "huggingface-hub>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: calls the real model API and costs money; skipped unless pytest is run with --live",
]
