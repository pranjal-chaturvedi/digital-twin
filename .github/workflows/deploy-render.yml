name: Deploy to Render.com

on:
  push:
    branches: [main]
  workflow_dispatch:
    tags:
      - '*'

# Only the newest push needs to reach the Space
concurrency:
  group: deploy-render
  cancel-in-progress: true

permissions:
  contents: read
  # Required for render-deploy-action to create releases and trigger deployments
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: astral-sh/setup-uv@v6
      
      # Create a GitHub release with version tags
      # Render.com monitors releases to auto-trigger deployments
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.run_number || '0.0.1' }}
        run: |
          if [ "$GITHUB_REF" = "refs/tags/v*" ]; then
            echo "Version tag detected, skipping release creation"
          else
            git tag -a "v$VERSION" -m "Release $VERSION for Render.com deployment"
            gh release create "v$VERSION" --title "Deploy to Render.com v$VERSION" --target main --generate-notes
          fi
      
      # Prepare files for release (same as Space files)
      - name: Prepare Release files
        run: |
          mkdir deploy
          cp README.md deploy/
          cp /digital_twin deploy/
          cp app.py deploy/
          cp pyproject.toml deploy/
          cp uv.lock deploy/
  deploy:
    needs: release
    runs-on: ubuntu-latest
    # Skip until the Space is configured, so pushes don't fail before setup
    if: vars.RENDER_DEPLOY != ''
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Render.com
        uses: render/web-deploy-action@v1
        env:
          RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
        with:
          account_id: ${{ vars.RENDER_ACCOUNT_ID }}
          project_name: 'digital-twin'
          region: us-east-1
          name: digital-twin
          type: web
          build_command: uv sync --frozen && uv cache prune --ci
          start_command: uv run python app.py